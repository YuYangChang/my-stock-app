<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="選股幫手">
  <title>選股幫手</title>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #000; color: #fff; margin: 0; padding: 16px; -webkit-tap-highlight-color: transparent; }
    
    h1 { font-size: 1.4rem; margin: 0 0 16px 0; text-align: center; color: #f2f2f7; }

    /* 搜尋區域：加大輸入框與按鈕 */
    .search-card { background: #1c1c1e; padding: 14px; border-radius: 16px; margin-bottom: 16px; }
    .search-row { display: flex; gap: 10px; }
    .search-input { flex: 1; background: #2c2c2e; border: 1px solid #3a3a3c; color: #fff; padding: 12px 16px; border-radius: 12px; font-size: 1rem; outline: none; }
    .search-input::placeholder { color: #8e8e93; }
    .btn-add { background: #30d158; color: #000; border: none; padding: 12px 20px; border-radius: 12px; font-weight: bold; font-size: 1rem; cursor: pointer; }

    /* 市場分類 Tab：大按鈕 */
    .market-tabs { display: flex; background: #1c1c1e; padding: 4px; border-radius: 12px; margin-bottom: 16px; }
    .tab-btn { flex: 1; padding: 10px 0; text-align: center; border: none; background: transparent; color: #8e8e93; font-size: 0.95rem; font-weight: 600; border-radius: 8px; cursor: pointer; }
    .tab-btn.active { background: #6366f1; color: #fff; }

    /* 股票選單：大型流動橫條 */
    .stock-list { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; -webkit-overflow-scrolling: touch; }
    .stock-chip { background: #1c1c1e; border: 1px solid #2c2c2e; color: #e5e5ea; padding: 10px 16px; border-radius: 20px; font-size: 0.95rem; white-space: nowrap; display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .stock-chip.active { background: #0a84ff; border-color: #0a84ff; color: #fff; font-weight: bold; }
    .chip-del { font-size: 0.9rem; color: #ff453a; opacity: 0.7; padding: 2px 4px; }

    /* 主要報價卡片 */
    .main-card { background: #1c1c1e; padding: 18px; border-radius: 16px; margin-bottom: 16px; }
    .price-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .stock-title { font-size: 1.4rem; font-weight: bold; color: #fff; }
    .stock-sub { font-size: 0.85rem; color: #8e8e93; margin-top: 4px; }
    .price-box { text-align: right; }
    .price-num { font-size: 1.8rem; font-weight: 800; }
    .currency-tag { font-size: 0.85rem; color: #8e8e93; margin-left: 4px; }
    .change-num { font-size: 1.05rem; font-weight: 600; margin-top: 4px; }
    .up { color: #ff453a; }
    .down { color: #30d158; }

    /* 圖表區域 */
    .chart-card { background: #1c1c1e; padding: 16px; border-radius: 16px; }
    .chart-header { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 0.85rem; }
    .legend { display: flex; gap: 12px; }
    .leg-ma5 { color: #e5c07b; } .leg-ma20 { color: #61afef; } .leg-ma60 { color: #c678dd; }
    
    canvas { width: 100% !important; height: 260px !important; display: block; }
  </style>
</head>
<body>

  <h1>📈 台美股波段儀表板</h1>

  <!-- 分類選單 -->
  <div class="market-tabs">
    <button class="tab-btn active" onclick="switchMarket('ALL')">全部</button>
    <button class="tab-btn" onclick="switchMarket('TWD')">台股</button>
    <button class="tab-btn" onclick="switchMarket('USD')">美股/ADR</button>
    <button class="tab-btn" onclick="switchMarket('OTHER')">日韓股</button>
  </div>

  <!-- 搜尋與新增 -->
  <div class="search-card">
    <div class="search-row">
      <input type="text" id="searchInput" class="search-input" placeholder="輸入名稱或代號 (如: 台積電, 聯發科, NVDA)" />
      <button onclick="addStock()" class="btn-add">新增</button>
    </div>
  </div>

  <!-- 股票選單標籤 -->
  <div class="stock-list" id="stockList"></div>

  <!-- 價格卡片 -->
  <div class="main-card">
    <div class="price-header">
      <div>
        <div id="dispName" class="stock-title">載入中...</div>
        <div id="dispSymbol" class="stock-sub">--</div>
      </div>
      <div class="price-box">
        <div><span id="dispPrice" class="price-num">--</span><span id="dispCurrency" class="currency-tag"></span></div>
        <div id="dispChange" class="change-num">--</div>
      </div>
    </div>
  </div>

  <!-- K線與均線圖表 (原生 Canvas) -->
  <div class="chart-card">
    <div class="chart-header">
      <span style="color:#8e8e93">日線技術分析</span>
      <div class="legend">
        <span class="leg-ma5">━ 5MA</span>
        <span class="leg-ma20">━ 20MA</span>
        <span class="leg-ma60">━ 60MA</span>
      </div>
    </div>
    <canvas id="klineCanvas"></canvas>
  </div>

  <script>
    // ⚠️ 請填寫你自己的 Cloudflare Worker 網址
    const PROXY_URL = "https://stock-proxy.jeff8246532.workers.dev/";

    // 常用股票名稱/代號映射庫（支援輸入中文搜尋）
    const STOCK_DICT = {
      "台積電": "2330.TW", "聯發科": "2454.TW", "鴻海": "2317.TW", "廣達": "2382.TW", "緯創": "3231.TW",
      "台積電ADR": "TSM", "輝達": "NVDA", "美光": "MU", "超微": "AMD", "蘋果": "AAPL",
      "三星": "005930.KS", "三星電子": "005930.KS", "海力士": "000660.KS", "SK海力士": "000660.KS",
      "東京威力": "8035.T", "愛德萬": "6857.T"
    };

    // 預設股票
    const DEFAULT_STOCKS = [
      { symbol: '2330.TW', name: '台積電', type: 'TWD' },
      { symbol: 'TSM', name: '台積電 ADR', type: 'USD' },
      { symbol: 'NVDA', name: '輝達', type: 'USD' },
      { symbol: '000660.KS', name: 'SK 海力士', type: 'OTHER' },
      { symbol: '005930.KS', name: '三星電子', type: 'OTHER' }
    ];

    let myStocks = JSON.parse(localStorage.getItem('my_stocks_v2')) || DEFAULT_STOCKS;
    let currentSymbol = myStocks[0].symbol;
    let currentMarketFilter = 'ALL';

    function getStockType(symbol) {
      if (symbol.endsWith('.TW') || symbol.endsWith('.TWO')) return { type: 'TWD', currency: 'TWD' };
      if (symbol.endsWith('.KS')) return { type: 'OTHER', currency: 'KRW' };
      if (symbol.endsWith('.T')) return { type: 'OTHER', currency: 'JPY' };
      return { type: 'USD', currency: 'USD' };
    }

    function switchMarket(market) {
      currentMarketFilter = market;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderStockList();
    }

    function renderStockList() {
      const listContainer = document.getElementById('stockList');
      listContainer.innerHTML = '';

      const filtered = myStocks.filter(s => currentMarketFilter === 'ALL' || s.type === currentMarketFilter);

      filtered.forEach(s => {
        const chip = document.createElement('div');
        chip.className = `stock-chip ${s.symbol === currentSymbol ? 'active' : ''}`;
        chip.innerHTML = `
          <span onclick="selectStock('${s.symbol}')">${s.name}</span>
          <span class="chip-del" onclick="deleteStock(event, '${s.symbol}')">✕</span>
        `;
        listContainer.appendChild(chip);
      });
    }

    function selectStock(symbol) {
      currentSymbol = symbol;
      renderStockList();
      fetchStockData(symbol);
    }

    function addStock() {
      const input = document.getElementById('searchInput');
      let query = input.value.trim();
      if (!query) return;

      let symbol = STOCK_DICT[query] || query.toUpperCase();
      
      // 如果數字沒加字尾，預設為台股 .TW
      if (/^\d{4}$/.test(symbol)) {
        symbol += ".TW";
      }

      if (myStocks.some(s => s.symbol === symbol)) {
        alert('該股票已在清單中');
        return;
      }

      const info = getStockType(symbol);
      myStocks.push({ symbol: symbol, name: query.toUpperCase(), type: info.type });
      localStorage.setItem('my_stocks_v2', JSON.stringify(myStocks));
      input.value = '';
      selectStock(symbol);
    }

    function deleteStock(e, symbol) {
      e.stopPropagation();
      if (myStocks.length <= 1) return alert('請至少保留一檔股票');
      myStocks = myStocks.filter(s => s.symbol !== symbol);
      localStorage.setItem('my_stocks_v2', JSON.stringify(myStocks));
      if (currentSymbol === symbol) currentSymbol = myStocks[0].symbol;
      renderStockList();
      fetchStockData(currentSymbol);
    }

    async function fetchStockData(symbol) {
      try {
        const res = await fetch(`${PROXY_URL}?symbol=${symbol}&range=6m`);
        const json = await res.json();

        if (!json.chart || !json.chart.result) {
          alert('找不到此股票資料，請檢查代號！');
          return;
        }

        const result = json.chart.result[0];
        const quotes = result.indicators.quote[0];
        const timestamps = result.timestamp;
        const meta = result.meta;

        let kData = [];
        for (let i = 0; i < timestamps.length; i++) {
          if (quotes.close[i] && quotes.open[i]) {
            kData.push({
              open: quotes.open[i],
              high: quotes.high[i],
              low: quotes.low[i],
              close: quotes.close[i]
            });
          }
        }

        const info = getStockType(symbol);
        document.getElementById('dispName').innerText = meta.shortName || symbol;
        document.getElementById('dispSymbol').innerText = symbol;
        document.getElementById('dispCurrency').innerText = info.currency;

        const last = kData[kData.length - 1];
        const prev = kData[kData.length - 2];
        const diff = (last.close - prev.close).toFixed(2);
        const pct = ((diff / prev.close) * 100).toFixed(2);
        const isUp = diff >= 0;

        document.getElementById('dispPrice').innerText = last.close.toFixed(2);
        const changeEl = document.getElementById('dispChange');
        changeEl.innerText = `${isUp ? '+' : ''}${diff} (${isUp ? '+' : ''}${pct}%)`;
        changeEl.className = `change-num ${isUp ? 'up' : 'down'}`;

        // 使用 Canvas 繪製 K 線與均線
        drawCanvasChart(kData);

      } catch (err) {
        console.error("抓取失敗:", err);
      }
    }

    // Canvas K線與均線繪製器
    function drawCanvasChart(data) {
      const canvas = document.getElementById('klineCanvas');
      const ctx = canvas.getContext('2d');
      
      // 解決 Retina 螢幕高畫質渲染問題
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);

      const width = rect.width;
      const height = rect.height;

      ctx.clearRect(0, 0, width, height);

      // 只取最近 60 天畫圖
      const chartData = data.slice(-60);
      
      // 計算 MA
      const getMA = (days) => {
        return chartData.map((_, idx) => {
          if (idx < days - 1) return null;
          let sum = 0;
          for (let i = 0; i < days; i++) sum += chartData[idx - i].close;
          return sum / days;
        });
      };

      const ma5 = getMA(5);
      const ma20 = getMA(20);
      const ma60 = getMA(60);

      // 計算極值
      let min = Math.min(...chartData.map(d => d.low));
      let max = Math.max(...chartData.map(d => d.high));
      const padding = (max - min) * 0.1;
      min -= padding;
      max += padding;

      const getY = (val) => height - ((val - min) / (max - min)) * height;
      const candleWidth = (width / chartData.length) * 0.6;
      const step = width / chartData.length;

      // 1. 畫 K 線
      chartData.forEach((d, i) => {
        const x = i * step + step / 2;
        const isUp = d.close >= d.open;
        const color = isUp ? '#ff453a' : '#30d158';

        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = 1.5;

        // 上下影線
        ctx.beginPath();
        ctx.moveTo(x, getY(d.high));
        ctx.lineTo(x, getY(d.low));
        ctx.stroke();

        // 實體
        const yOpen = getY(d.open);
        const yClose = getY(d.close);
        ctx.fillRect(x - candleWidth / 2, Math.min(yOpen, yClose), candleWidth, Math.max(Math.abs(yClose - yOpen), 2));
      });

      // 2. 畫 MA 均線
      const drawLine = (maArray, color) => {
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        let started = false;

        maArray.forEach((val, i) => {
          if (val !== null) {
            const x = i * step + step / 2;
            const y = getY(val);
            if (!started) {
              ctx.moveTo(x, y);
              started = true;
            } else {
              ctx.lineTo(x, y);
            }
          }
        });
        ctx.stroke();
      };

      drawLine(ma5, '#e5c07b');
      drawLine(ma20, '#61afef');
      drawLine(ma60, '#c678dd');
    }

    window.onload = () => {
      renderStockList();
      fetchStockData(currentSymbol);
    };
  </script>
</body>
</html>
